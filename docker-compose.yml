services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: fulfillment
      POSTGRES_USER: fulfillment
      POSTGRES_PASSWORD: fulfillment
    ports:
      - "5433:5432"
    volumes:
      - fulfillment_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fulfillment -d fulfillment"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  fulfillment_pgdata:
