[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"

[project]
name="fulfillment-optimizer"
version="1.1.0"
description="Enterprise order fulfillment and delivery promise optimization platform"
requires-python=">=3.11"
dependencies=[
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.14",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "faker>=33",
  "numpy>=2.1",
  "pyyaml>=6.0",
  "Authlib>=1.9",
  "itsdangerous>=2.2",
  "httpx>=0.27"
]

[project.optional-dependencies]
dev=[
  "pytest>=8.3",
  "httpx>=0.27",
  "pytest-cov>=6.0"
]

[project.scripts]
fulfillment="fulfillment.cli:main"

[tool.setuptools.packages.find]
where=["src"]

[tool.pytest.ini_options]
pythonpath=["src"]
addopts="-q"
